name: Crowdin sync

# Uploads en-us/messages.pot to https://crowdin.com/project/openpanel and opens
# a pull request with the translations people made in the Crowdin editor.
# Needs the repo secrets CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN.

on:
  push:
    branches: [main]
    paths: ["en-us/messages.pot"]
  schedule:
    # 04:23 UTC every day
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      upload_translations:
        description: "Also upload the translations from this repo to Crowdin (overwrites what is in Crowdin)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: secrets
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "::warning::CROWDIN_PROJECT_ID / CROWDIN_PERSONAL_TOKEN secrets are not set, skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - name: Crowdin push and pull
        if: steps.secrets.outputs.ok == 'true'
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: ${{ github.event.inputs.upload_translations == 'true' }}
          download_translations: true
          localization_branch_name: crowdin-translations
          create_pull_request: true
          pull_request_title: "New translations from Crowdin"
          pull_request_body: "Translations made in the Crowdin editor (https://crowdin.com/project/openpanel)."
          pull_request_base_branch_name: main
          commit_message: "New translations from Crowdin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
