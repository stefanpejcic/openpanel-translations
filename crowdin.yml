"project_id_env": CROWDIN_PROJECT_ID
"api_token_env": CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true

files:
  - source: /en-us/messages.pot
    translation: /%locale%/messages.po

    languages_mapping:
      locale:
        bg: bg-bg
        de: de-de
        es-ES: es-es
        fr: fr-fr
        hu: hu-hu
        lo: lo-la
        ne: ne-np
        nl: nl-nl
        pl: pl-pl
        pt-BR: pt-br
        ro: ro-ro
        ru: ru-ru
        sr: sr-rs
        sv-SE: sv-se
        tr: tr-tr
        uk: uk-ua
        zh-CN: zh-cn
